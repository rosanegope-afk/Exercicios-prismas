<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prismas · Lista 4</title><style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1b2631;--mut:#5b6977;--ac:#0b6e78;--acf:#fff;--ln:#d3dae0;--ok:#1d7a3c;--bad:#b3412f;--hi:#e6f2f3;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e6ebef;--mut:#9aa8b5;--ac:#4fc0cc;--acf:#08262a;--ln:#2d3b47;--ok:#58c37a;--bad:#ef8a76;--hi:#12333a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 6px}h3{font-size:1rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.mut{color:var(--mut);font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button.p{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}button.on{outline:2px solid var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.gs{display:flex;gap:8px;flex-wrap:wrap}.gs button{min-width:52px;font-size:1.15rem;font-weight:700}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
input:disabled{opacity:.75}label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 2px}
.op{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:1rem;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:110px}
.ban{border-radius:10px;padding:12px;margin:12px 0;font-weight:700;text-align:center}.ban.t{background:var(--card);border:1px solid var(--ln);color:var(--ac);font-size:1.4rem;font-variant-numeric:tabular-nums}.ban.f{background:#b3412f;color:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--ln);padding:6px;text-align:center}
details{border-top:1px solid var(--ln);padding:6px 0}summary{cursor:pointer}
</style></head><body><main><h1>Prismas · Lista 4 · Rodízio</h1><div id="app"></div></main><script>
const EXS={
5:{t:"Exercício 5 · cubo e círculo",q:"As faces de um cubo são inscritíveis em círculos de 7,29π cm² de área. Calcule: a) a medida da diagonal; b) a área total; c) o volume do cubo.",p:[["Raio e aresta","Calcule o raio do círculo e a aresta do cubo (a face é um quadrado inscrito no círculo).",{n:["raio (cm)","aresta (cm)"]}],["Diagonal do cubo","Item a: com a aresta do passo 1, calcule a diagonal do cubo.",{n:["diagonal (cm)"]}],["Área total","Item b: calcule a área total.",{n:["área total (cm²)"]}],["Volume","Item c: calcule o volume.",{n:["volume (cm³)"]}]]},
6:{t:"Exercício 6 · prisma oblíquo",q:"Num prisma oblíquo a aresta lateral mede 5 cm; a seção reta é um trapézio isósceles de altura 8 cm e bases 7 cm e 19 cm. Calcule a área lateral.",p:[["Lado oblíquo","Desenhe a seção reta e calcule o lado não paralelo do trapézio.",{n:["lado oblíquo (cm)"]}],["Perímetro","Calcule o perímetro da seção reta.",{n:["perímetro (cm)"]}],["Fórmula","A área lateral de um prisma oblíquo é igual a:",{m:["perímetro da base × altura","perímetro da seção reta × aresta lateral","perímetro da base × aresta lateral","área da seção reta × aresta lateral"]}],["Área lateral","Calcule a área lateral.",{n:["área lateral (cm²)"]}]]},
13:{t:"Exercício 13 · ortoedro",q:"Um ortoedro tem diagonal 13 cm e área total 192 cm². A seção por um plano que contém duas arestas opostas tem área 60 cm². Calcule as dimensões.",p:[["Soma das dimensões","Obtenha x+y+z a partir da diagonal e da área total.",{n:["x + y + z (cm)"]}],["Aresta z","Mostre que a seção é um retângulo, monte a equação da área e ache os dois valores possíveis da aresta z paralela às arestas da seção.",{n:["z (um valor)","z (outro valor)"]}],["Primeiro caso","Dimensões quando z é o maior dos dois valores.",{n:["x (cm)","y (cm)","z (cm)"]}],["Segundo caso","Dimensões quando z é o menor dos dois valores (decimais com 2 casas).",{n:["x (cm)","y (cm)","z (cm)"]}]]},
15:{t:"Exercício 15 · ortoedro com cubo",q:"Sobre a base quadrada de um ortoedro constrói-se exteriormente um cubo cuja base é o quadrado de vértices nos pontos médios dos lados dessa base. A altura do ortoedro é 2/3 do lado da base e a soma das dimensões do ortoedro é 16 cm. Calcule o volume e a área da superfície do sólido.",p:[["Dimensões","Calcule o lado da base e a altura do ortoedro, e a aresta do cubo.",{n:["lado da base (cm)","altura (cm)","aresta do cubo (cm)"]}],["Volume","Calcule o volume do sólido.",{n:["volume (cm³)"]}],["Áreas separadas","Calcule a área total do ortoedro e a do cubo.",{n:["ortoedro (cm²)","cubo (cm²)"]}],["Área do sólido","Descontando a região de contato, calcule a área da superfície do sólido.",{n:["área (cm²)"]}]]},
16:{t:"Exercício 16 · cubo e diagonal",q:"Demonstre que, em um cubo: a) as arestas são igualmente inclinadas em relação a uma diagonal qualquer; b) as projeções das arestas sobre qualquer diagonal são iguais à terça parte da diagonal.",p:[["Diagonal","Em um cubo de aresta a, o comprimento da diagonal é:",{m:["a√2","a√3","3a","a/√3"]}],["Ângulo","Calcule o cosseno do ângulo θ entre a diagonal e uma aresta que parte do mesmo vértice.",{n:["cos θ (2 casas)"]}],["Todas as arestas","As 12 arestas formam o mesmo ângulo com a diagonal porque:",{m:["são paralelas a uma de apenas 3 direções, que por simetria formam o mesmo ângulo com a diagonal","todas têm o mesmo comprimento, e só isso","a diagonal é perpendicular às arestas","o cubo tem 6 faces"]}],["Projeção","Calcule a razão (projeção da aresta) ÷ (diagonal), em decimal com 2 casas.",{n:["razão"]}]]}};
const ORD=[5,6,13,15,16],GS="ABCDE",W=720,P=780;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const exOf=(g,r)=>ORD[(GS.indexOf(g)+r-1)%5];
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

const T0=+(new URLSearchParams(location.hash.slice(1)).get("t"))||0;
let grp=ls.g("grp"),key="";
const draft=k=>{let d=null;try{d=JSON.parse(ls.g("d_"+k))}catch(e){}return d||{f:[[],[],[],[]],quem:["","","",""],aud:""}};
function phase(){
  if(!T0)return{p:"sem"};
  const s=(Date.now()-T0)/1000;if(s<0)return{p:"antes",rest:-s};
  const R=Math.floor(s/P);if(R>=5)return{p:"fim",r:5};
  const w=s-R*P;return w<W?{p:"ativa",r:R+1,rest:W-w}:{p:"troca",r:R+1,rest:P-w};
}
function code(r){const d=draft(r+"_"+grp);const o={g:grp,r:r,a:d.f.map(x=>(x||[]).join("|")),q:d.quem,u:d.aud};return "L4:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function render(){
  const ph=phase();key=ph.p+(ph.r||"");
  let h=`<div class="card"><h2>Grupo</h2><div class="gs">${GS.split("").map(g=>`<button data-g="${g}" class="${g===grp?"on":""}">${g}</button>`).join("")}</div></div>`;
  if(ph.p==="sem")h+=`<div class="card">Abra o link da aula enviado pela professora. Sem ele, o relógio não funciona.</div>`;
  else if(ph.p==="antes")h+=`<div class="ban t" id="tm"></div><div class="card">A rodada 1 começa em instantes. Escolham o grupo e aguardem.</div>`;
  else if(!grp)h+=`<div class="card">Escolha o seu grupo para ver o exercício.</div>`;
  else{
    const r=ph.r,E=EXS[exOf(grp,r)],d=draft(r+"_"+grp),act=ph.p==="ativa",dis=act?"":"disabled";
    h+=act?`<div class="ban t" id="tm"></div>`:ph.p==="fim"?`<div class="ban f">Aula encerrada</div>`:`<div class="ban f">Tempo esgotado · troquem de estação · próxima rodada em <span id="tm"></span></div>`;
    h+=`<div class="card"><h2>Rodada ${r} de 5 · ${E.t}</h2><p>${esc(E.q)}</p><p class="mut">Cadeia estrita: o resultado de cada passo vai, de mão em mão, ao colega do passo seguinte. Respostas numéricas em decimal (vírgula ou ponto), sem usar raiz.</p></div>`;
    E.p.forEach((p,i)=>{const sp=p[2],f=d.f[i]||[];
      const fields=sp.m?sp.m.map((o,j)=>`<label class="op"><input type="radio" name="m${i}" data-f="a" data-i="${i}" data-j="0" value="${j}" ${String(f[0])===String(j)?"checked":""} ${dis}> ${esc(o)}</label>`).join(""):
        `<div class="row">${sp.n.map((lb,j)=>`<div><label>${esc(lb)}</label><input type="text" inputmode="decimal" data-f="a" data-i="${i}" data-j="${j}" value="${esc(f[j])}" ${dis}></div>`).join("")}</div>`;
      h+=`<div class="card"><h3>Passo ${i+1} · ${p[0]}</h3><p class="mut">${p[1]}</p>${fields}<label>Aluno nº</label><div style="max-width:90px"><input type="text" inputmode="numeric" data-f="quem" data-i="${i}" value="${esc(d.quem[i])}" ${dis}></div></div>`});
    h+=`<div class="card"><label>Auditor(es) nº</label><input type="text" data-f="aud" value="${esc(d.aud)}" ${dis}></div>`;
    if(!act)h+=`<div class="card"><h3>Código de envio</h3><p class="mut">Mande este código à professora (WhatsApp ou e-mail).</p><input type="text" id="cd" readonly value="${code(r)}"><p><button class="p" id="cp">Copiar código</button></p></div>`;
  }
  $("#app").innerHTML=h;tick();
}
function tick(){
  const ph=phase();if(ph.p+(ph.r||"")!==key){render();return}
  const t=$("#tm");if(t&&ph.rest!=null)t.textContent=mmss(ph.rest);
}
setInterval(tick,500);
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.g){grp=b.dataset.g;ls.s("grp",grp);render()}
  else if(b.id==="cp"){const c=$("#cd").value;try{await navigator.clipboard.writeText(c);b.textContent="Copiado"}catch(err){$("#cd").select();b.textContent="Selecione e copie o texto"}}
});
document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset&&t.dataset.f,ph=phase();if(!f||!grp||ph.p!=="ativa")return;
  const k=ph.r+"_"+grp,d=draft(k),i=+t.dataset.i,j=+t.dataset.j;
  if(f==="aud")d.aud=t.value;else if(f==="quem")d.quem[i]=t.value;else{d.f[i]=d.f[i]||[];d.f[i][j]=t.value}
  ls.s("d_"+k,JSON.stringify(d));
});
render();
</script></body></html>
